name = "trinity-check-intake"
main = "index.js"
compatibility_date = "2026-01-01"

# Durable copy of every submission. Same namespace trinity-counter already uses, so the
# deck waitlist (wl:<email>) stays one list and GET /waitlist on the counter still exports it.
[[kv_namespaces]]
binding = "STORE"
id = "3a7a86a7169844f396fc5bf2281e15bd"

# R2 is NOT enabled on this Cloudflare account yet (API code 10042 on 2026-11-15).
# When you turn it on (dashboard → R2 → enable, then `npx wrangler r2 bucket create trinity-submissions`),
# un-comment these three lines and redeploy. The Worker then writes a second copy to R2 automatically.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "trinity-submissions"

[vars]
NOTIFY_TO = "vincent@easeai.com.tw"
PUBLIC_EMAIL = "vincent@easeai.com.tw"
MAIL_FROM = "Trinity Check <trinity@vs.easeai.com.tw>"
SITE_URL = "https://trinity.easeai.com.tw"

# Same-origin API: the Pages site and this Worker share the hostname, so the front end calls
# /api/intake with no CORS and the CSP stays at connect-src 'self'.
routes = [
  { pattern = "trinity.easeai.com.tw/api/*", zone_name = "easeai.com.tw" }
]

# Secrets (not in this file). deploy_261115.sh sets both:
#   RESEND_API_KEY   the send-only key already used by vincent.easeai.com.tw (from ~/.config/secure/vs-site.env)
#   INTAKE_TOKEN     random token for GET /api/intake/list (saved to ~/.config/secure/trinity_intake_token)
